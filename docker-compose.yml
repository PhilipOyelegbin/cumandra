services:
    redis_cache:
        image: redis:latest
        container_name: cumandra_redis
        ports:
            - "6379:6379"
        volumes:
            - cumandra_redis:/var/lib/redis/data
        mem_limit: 256m
        cpus: 0.5
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    cumandra_redis:
        driver: local
networks:
    default:
        name: cumandra_network
        driver: bridge
